name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install a desktop to test against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-daemon at-spi2-core python3-gi gir1.2-gtk-3.0 gnome-calculator
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integration tests (in a headless desktop)
        run: npm run test:integration
